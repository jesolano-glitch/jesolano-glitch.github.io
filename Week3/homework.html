
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apex Legends Card</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <style>

        body {
            background-color: #171717;
            font-family: "Inter", sans-serif;

            display: flex;
            justify-content: center;

            padding: 40px;
            margin: 0;
        }

        .card {
            width: 500px;
            height: 750px;

            background-color: #262626;

            padding: 36px;
            border-radius: 12px;

            box-sizing: border-box;

            box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.6);
        }

        /* CARD IMAGE */
        .card img {
            width: 100%;
            height: 300px;

            object-fit: cover;

            margin-bottom: 12px;
            border-radius: 8px;
        }

        .card h1 {
            font-family: "Rajdhani", sans-serif;
            font-size: 42px;
            font-weight: 700;

            color: #FF9950;

            margin-top: 12px;
            margin-bottom: 16px;
        }

        .card p {
            font-family: "Inter", sans-serif;
            font-size: 17px;

            line-height: 1.6;
            color: #B5ACA2;
        }

        .card a {
            display: inline-block;

            background-color: #FF9950;
            color: #171717;

            padding: 14px 24px;
            border-radius: 6px;

            text-decoration: none;
            font-family: "Inter", sans-serif;
            font-weight: 600;

            margin-top: 24px;

            transition: background-color 300ms ease;
        }

        .card a:hover {
            background-color: #FFC08A;
        }

    </style>
</head>

<body>

    <div class="card">

        <img src="./portfolio/assets/apex.jpg"
             alt="Apex Legends promotional artwork">

        <h1>ENTER THE ARENA</h1>

        <p>
            Apex Legends is a fast-paced battle royale
            where unique Legends compete to become
            champions. Choose your character, work
            with your squad, and fight for victory.
        </p>

        <a href="https://www.ea.com/games/apex-legends"
           target="_blank"
           rel="noopener noreferrer">
            EXPLORE APEX LEGENDS
        </a>

    </div>

</body>
</html>
